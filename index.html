<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Walker: make your walks interesting</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #000; --accent: #ff4757; --bg: #f1f2f6; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; }
        
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 1.4rem; font-weight: 700; }
        .header p { margin: 5px 0 0; opacity: 0.8; font-size: 0.9rem; }

        .controls { padding: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
        .hint { font-size: 0.8rem; color: #777; margin-top: 4px; display: block; }
        
        /* Range Slider Styling */
        input[type="range"] { width: 100%; height: 6px; background: #ddd; border-radius: 5px; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; cursor: pointer; }
        
        .val-display { float: right; font-weight: bold; color: var(--accent); }

        button { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }

        #map { height: 350px; width: 100%; background: #eee; }

        .results { padding: 20px; text-align: center; display: none; background: #fafafa; border-top: 1px solid #eee; }
        .gmaps-btn { display: inline-block; background: #4285F4; color: white; text-decoration: none; padding: 12px 25px; border-radius: 50px; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 6px rgba(66, 133, 244, 0.3); }
        .warning { color: #e67e22; font-size: 0.85rem; margin-top: 10px; display: none; background: #fff3cd; padding: 10px; border-radius: 6px;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚶 Random Walker</h1>
        <p>Set your distance, then limit the range.</p>
    </div>

    <div class="controls">
        <div class="input-group">
            <label>1. How far do you want to walk? <span id="distVal" class="val-display">5.0 km</span></label>
            <input type="range" id="targetDist" min="1" max="15" step="0.5" value="5" oninput="updateLabels()">
            <span class="hint">Actual distance of path can be +- 1km.</span>
        </div>

        <div class="input-group">
            <label>2. Stay within radius: <span id="radVal" class="val-display">1.5 km</span></label>
            <input type="range" id="maxRadius" min="0.5" max="5" step="0.1" value="1.5" oninput="updateLabels()">
            <span class="hint">The path will not go further than this from home.</span>
        </div>

        <button onclick="generatePath()">Generate Path</button>
    </div>

    <div id="map"></div>

    <div class="results" id="resultsBox">
        <strong>Path Generated!</strong><br>
        <span id="pathStats" style="font-size: 0.9rem; color: #555;"></span>
        <div id="radiusWarning" class="warning">⚠️ Your radius is too small for this distance. The path was shrunk to fit the radius.</div>
        <br>
        <a id="gmapsLink" href="#" target="_blank" class="gmaps-btn">Open in Google Maps</a>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- State & Config ---
    let map, homeMarker, pathLayer, routePoints = [];
    let userLat = null, userLon = null;
    
    // Tortuosity Factor: Roads are not straight lines. 
    // If we want a 5km walk, we generate a polygon with ~3.8km perimeter (5 / 1.3)
    // because the actual street walking will add about 30% to the length.
    const STREET_FACTOR = 1.35; 

    function updateLabels() {
        document.getElementById('distVal').innerText = document.getElementById('targetDist').value + " km";
        document.getElementById('radVal').innerText = document.getElementById('maxRadius').value + " km";
    }

    // --- Core Logic ---

    // 1. Math Helpers
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;

    function getPointAtDistAndBearing(lat, lon, distKm, bearingDeg) {
        const R = 6371; 
        const d = distKm;
        const brng = toRad(bearingDeg);
        const lat1 = toRad(lat);
        const lon1 = toRad(lon);
        const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d/R) + Math.cos(lat1) * Math.sin(d/R) * Math.cos(brng));
        const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d/R) * Math.cos(lat1), Math.cos(d/R) - Math.sin(lat1) * Math.sin(lat2));
        return { lat: toDeg(lat2), lng: toDeg(lon2) };
    }

    function getEuclideanDistKm(p1, p2) {
        // Simple approximation for small local areas (sufficient for scaling logic)
        const R = 6371;
        const dLat = toRad(p2.lat - p1.lat);
        const dLon = toRad(p2.lng - p1.lng);
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(toRad(p1.lat)) * Math.cos(toRad(p2.lat)) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // 2. Map Init
    function initMap() {
        if (!navigator.geolocation) { alert("GPS not supported"); return; }
        
        navigator.geolocation.getCurrentPosition(pos => {
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            
            map = L.map('map').setView([userLat, userLon], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            homeMarker = L.marker([userLat, userLon]).addTo(map).bindPopup("Home").openPopup();
            
            // Draw initial Circle
            L.circle([userLat, userLon], { radius: 1500, color: '#ddd', fillOpacity: 0.1 }).addTo(map);
        }, err => alert("Please allow Location access to use this app."));
    }

    // 3. The Algorithm
    function generatePath() {
        if (!userLat) { alert("Finding location..."); return; }

        const targetDistRaw = parseFloat(document.getElementById('targetDist').value);
        const maxRadius = parseFloat(document.getElementById('maxRadius').value);
        
        // Adjust target distance for "Air vs Road" reality
        const targetPerimeter = targetDistRaw / STREET_FACTOR;

        // A. Generate a random polygon centered at (0,0)
        // We use 8 points for a nice shape
        let points = [];
        for(let i=0; i<8; i++) {
            // Random angle, random radius (0.5 to 1.0 to avoid spikes)
            const angle = (i / 8) * 360 + (Math.random() * 20); 
            const r = 0.5 + Math.random() * 0.5; 
            // Convert to relative cartesian (km)
            points.push({ 
                x: r * Math.cos(toRad(angle)), 
                y: r * Math.sin(toRad(angle)) 
            });
        }

        // B. Calculate current perimeter of this unit shape
        let currentPerim = 0;
        for(let i=0; i<points.length; i++) {
            const p1 = points[i];
            const p2 = points[(i+1) % points.length];
            const dist = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
            currentPerim += dist;
        }

        // C. Scale the shape to match Target Perimeter
        let scaleFactor = targetPerimeter / currentPerim;
        points = points.map(p => ({ x: p.x * scaleFactor, y: p.y * scaleFactor }));

        // D. Anchor logic: We want the User's Home (0,0) to be PART of the loop.
        // Currently the shape is centered at (0,0). Let's shift the shape so 
        // that Point[0] becomes (0,0).
        const shiftX = points[0].x;
        const shiftY = points[0].y;
        points = points.map(p => ({ x: p.x - shiftX, y: p.y - shiftY }));

        // E. Rotate random amount (so we don't always walk East first)
        const rotation = Math.random() * 2 * Math.PI;
        points = points.map(p => ({
            x: p.x * Math.cos(rotation) - p.y * Math.sin(rotation),
            y: p.x * Math.sin(rotation) + p.y * Math.cos(rotation)
        }));

        // F. CHECK RADIUS CONSTRAINT
        // Find the point furthest from (0,0)
        let maxDistFound = 0;
        points.forEach(p => {
            const d = Math.sqrt(p.x*p.x + p.y*p.y);
            if (d > maxDistFound) maxDistFound = d;
        });

        let constrained = false;
        if (maxDistFound > maxRadius) {
            // We are violating the radius. Shrink the whole shape.
            const shrinkFactor = maxRadius / maxDistFound;
            points = points.map(p => ({ x: p.x * shrinkFactor, y: p.y * shrinkFactor }));
            constrained = true;
        }

        // G. Convert back to Lat/Lon
        const finalGeoPoints = points.map(p => {
            // Approximation: 111.32km = 1 degree Lat
            const dLat = p.y / 111.32; 
            // Longitude correction based on latitude
            const dLon = p.x / (111.32 * Math.cos(toRad(userLat)));
            return { lat: userLat + dLat, lng: userLon + dLon };
        });

        // Add start point to end to close loop perfectly
        finalGeoPoints.push(finalGeoPoints[0]);

        render(finalGeoPoints, constrained, targetDistRaw);
    }

    function render(points, isConstrained, targetVal) {
        document.getElementById('resultsBox').style.display = 'block';
        document.getElementById('radiusWarning').style.display = isConstrained ? 'block' : 'none';

        // Clear Map
        if (pathLayer) map.removeLayer(pathLayer);
        routePoints.forEach(m => map.removeLayer(m));
        routePoints = [];

        // Draw Line
        const latLngs = points.map(p => [p.lat, p.lng]);
        pathLayer = L.polyline(latLngs, { color: '#ff4757', weight: 5 }).addTo(map);

        // Calculate final "Air" distance
        let totalAirDist = 0;
        for(let i=0; i<points.length-1; i++) {
            totalAirDist += getEuclideanDistKm(points[i], points[i+1]);
        }
        
        const estimatedWalk = (totalAirDist * STREET_FACTOR).toFixed(1);
        document.getElementById('pathStats').innerText = 
            `Target: ${targetVal}km | Estimated Walk: ~${estimatedWalk} km`;

        // Draw circles for waypoints
        points.forEach((p, index) => {
            if (index < points.length - 1) { // Don't draw last one (it's start)
               const mk = L.circleMarker([p.lat, p.lng], { radius: 4, color: '#333' }).addTo(map);
               routePoints.push(mk);
            }
        });

        map.fitBounds(pathLayer.getBounds(), { padding: [50,50] });

        // Generate URL
        const base = "https://www.google.com/maps/dir/";
        // We limit to 9 waypoints to ensure URL safety, though 8 is generated
        const coords = points.map(p => `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`).join('/');
        document.getElementById('gmapsLink').href = `${base}${coords}/data=!4m2!4m1!3e2`;
    }

    window.onload = initMap;

</script>
</body>
</html>
